services:
  postgres:
    image: postgres:17-alpine
    container_name: club-ai-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prisma
      POSTGRES_DB: club_ai
    ports:
      - "5432:5432"
    networks:
      - club-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d club_ai"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  club-ai-network:
    driver: bridge

volumes:
  postgres_data:
