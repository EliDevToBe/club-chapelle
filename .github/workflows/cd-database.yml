name: CD - Deploy database schema (production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect-prisma-changes:
    runs-on: ubuntu-latest
    outputs:
      has_prisma_changes: ${{ steps.filter.outputs.has_prisma_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Prisma-related changes in push
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_prisma_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "$CHANGED_FILES"

          HAS_PRISMA_CHANGES=false
          while IFS= read -r file; do
            if [[ "$file" == prisma/* ]] || [[ "$file" == "prisma.config.ts" ]]; then
              HAS_PRISMA_CHANGES=true
              break
            fi
          done <<< "$CHANGED_FILES"

          echo "has_prisma_changes=$HAS_PRISMA_CHANGES" >> "$GITHUB_OUTPUT"

  deploy:
    timeout-minutes: 15
    needs: detect-prisma-changes
    if: needs.detect-prisma-changes.outputs.has_prisma_changes == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports:
          - 5433:5432
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5433/test_db"
          DIRECT_URL: "postgresql://postgres:test@localhost:5433/test_db"

        run: npx prisma validate

      - name: Test migrations on local database
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5433/test_db"
          DIRECT_URL: "postgresql://postgres:test@localhost:5433/test_db"
          # Test migrations on local database
          # Verify the migration worked
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Check production database secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PRODUCTION_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_PRODUCTION_DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "::error::Secrets DATABASE_PRODUCTION_URL and DATABASE_PRODUCTION_DIRECT_URL are not set."
            exit 1
          fi

      - name: Deploy migrations to production
        env:
          DIRECT_URL: ${{ secrets.DATABASE_PRODUCTION_DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Verify migration success
        env:
          DIRECT_URL: ${{ secrets.DATABASE_PRODUCTION_DIRECT_URL }}
        run: |
          npx prisma migrate status
          npx prisma db execute --stdin <<< "SELECT current_database(), current_user, version();"
          npx prisma db execute --stdin <<< "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public';"
