name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: |
          npx prisma generate
          npm run check:schema

      - run: npm run check:ts

      - run: npm run test:run
