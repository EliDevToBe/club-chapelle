name: Release

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-release-pr:
    name: Open or reuse develop -> main PR
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse release PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = "main";
            const head = "develop";
            const title = "🚀 Release to Production";
            const body = [
              "Automated release PR created from `develop` to `main`.",
              "",
              "This PR must be merged through branch protection so CI/CD and deployment gates remain enforced.",
              "",
              "After merge, [Sync develop after release](.github/workflows/sync-develop-after-release.yml) merges `main` back into `develop` to prevent release drift."
            ].join("\n");

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${base}...${head}`,
            });

            const aheadBy = comparison.data.ahead_by;
            const changedFiles = comparison.data.files ?? [];

            if (aheadBy === 0 || comparison.data.status === "identical") {
              core.info("develop is not ahead of main; no release PR needed.");
              return;
            }

            if (changedFiles.length === 0) {
              core.info(
                `develop is ${aheadBy} commit(s) ahead of main but there are no file changes; no release PR needed.`,
              );
              return;
            }

            core.info(
              `develop is ${aheadBy} commit(s) ahead of main with ${changedFiles.length} changed file(s); checking for an open release PR.`,
            );

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base,
              head: `${owner}:${head}`,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              const pr = existing.data[0];
              core.info(`Release PR already open: #${pr.number} ${pr.html_url}`);
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              base,
              head,
              title,
              body,
              maintainer_can_modify: true,
            });

            core.info(`Created release PR: #${created.data.number} ${created.data.html_url}`);
