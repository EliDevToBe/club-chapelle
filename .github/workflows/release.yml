name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-release-pr:
    name: Open or reuse develop -> main PR
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse release PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = "main";
            const head = "develop";
            const title = "chore(release): promote develop to main";
            const body = [
              "Automated release PR created from `develop` to `main`.",
              "",
              "This PR must be merged through branch protection so CI/CD and deployment gates remain enforced."
            ].join("\n");

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base,
              head: `${owner}:${head}`,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              const pr = existing.data[0];
              core.info(`Release PR already open: #${pr.number} ${pr.html_url}`);
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              base,
              head,
              title,
              body,
              maintainer_can_modify: true,
            });

            core.info(`Created release PR: #${created.data.number} ${created.data.html_url}`);
